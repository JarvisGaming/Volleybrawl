<!DOCTYPE html>
<html>
<head>
    <title>Volleybrawl</title>
    <link href="reset.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- The hand game -->
    <div id="hand-game-area">

        <!-- The connect page -->
        <div id="hand-game-connect-page">
            <div class="row">
                <div class="col">
                    <div class="title">Connecting...</div>
                    <div id="connect-message" class="message"></div>
                </div>
            </div>
        </div>

        <!-- The join page -->
        <div id="hand-game-join-page" style="display: none">
            <div class="row">
                <div class="title col">
                    <div>Rock &#x270a;</div>
                    <div>Paper &#x270b;</div>
                    <div>Scissors &#x270c;</div>
                </div>
                <div class="col">
                    <form id="join-form" class="col">
                        <div class="caption">What's your name?</div>
                        <input id="join-name" maxlength="10" placeholder="Enter your name">
                        <button id="join-button">Join</button>
                    </form>
                    <div id="join-message" class="message"></div>
                </div>
            </div>
        </div>

        <!-- The main page -->
        <div id="hand-game-main-page" style="display: none">
            <div class="title">Room Listing</div>
            <div id="room-listing">
                <div class="room" data-roomid="room1">
                    <div class="player1-name"></div>
                    <b>VS</b>
                    <div class="player2-name"></div>
                    <div>
                        <button data-roomid="room1" class="join-room-button">Join</button>
                        <button data-roomid="room1" class="ready-button">Ready</button>
                    </div>
                </div>
                <div class="room" data-roomid="room2">
                    <div class="player1-name"></div>
                    <b>VS</b>
                    <div class="player2-name"></div>
                    <div>
                        <button data-roomid="room2" class="join-room-button">Join</button>
                        <button data-roomid="room2" class="ready-button">Ready</button>
                    </div>
                </div>
                <div class="room" data-roomid="room3">
                    <div class="player1-name"></div>
                    <b>VS</b>
                    <div class="player2-name"></div>
                    <div>
                        <button data-roomid="room3" class="join-room-button">Join</button>
                        <button data-roomid="room3" class="ready-button">Ready</button>
                    </div>
                </div>
            </div>
            <div id="room-message" class="message"></div>

            <template id="room-template">
                <div class="room" data-roomid="">
                    <div class="player1-name"></div>
                    <b>VS</b>
                    <div class="player2-name"></div>
                    <div>
                        <button data-roomid="" class="join-room-button">Join</button>
                        <button data-roomid="" class="ready-button">Ready</button>
                    </div>
                </div>
            </template>
        </div>

    </div>

    <!-- JavaScript files for the hand game -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="scripts/hand_game.js" defer></script>
    
</body>
</html>
