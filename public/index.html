<!DOCTYPE html>
<html>
<head>
    <title>Volleybrawl</title>
    
    <link href="reset.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

    <script src="scripts/jquery.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="scripts/game.js" defer></script>
</head>
<body>
    <!-- The connect page -->
    <div id="connect-page">
        <div class="row">
            <div class="col">
                <div class="title">Connecting...</div>

                <!-- I don't think this does anything -->
                <div id="connect-message" class="message"></div>
            </div>
        </div>
    </div>

    <!-- The join page -->
    <div id="join-page" style="display: none">
        <div class="row">
            <div class="title col">
                <div>Volleybrawl &#x1f3d0;</div>
            </div>
            <div class="col">
                <form id="join-form" class="col">
                    <div class="caption">What's your name?</div>
                    <input id="join-name" maxlength="20" placeholder="Enter your name" required>
                    <button id="join-button">Join</button>
                </form>
                <div id="join-message" class="message"></div>
            </div>
        </div>
    </div>

    <!-- The room listing page -->
    <div id="room-listing-page" style="display: none">
        <div class="title">Room Listing</div>
        <div id="room-message" class="message"></div>
        <button type="button" id="create-room-button">Create New Room</button>

        <!-- Rooms are dynamically added in here -->
        <div id="room-listing"></div>

        <!-- What each room looks like, which is copied and have its information filled in to create a new room element -->
        <!-- What each room looks like, which is copied and have its information filled in to create a new room element -->
        <template id="room-template">
            <div class="room" data-roomid="">
                <div class="player1-name"></div>
                <b>VS</b>
                <div class="player2-name"></div>
                <div>
                    <button type="button" data-roomid="" class="join-room-button">Join</button>
                    <button type="button" data-roomid="" class="leave-room-button">Leave</button>
                    <button type="button" data-roomid="" class="ready-button">Ready</button>
                </div>
            </div>
        </template>
    </div>

    <!-- The game page -->
    <div id="game-page" style="display: none">
        <div class="title">Game Page</div>
        <div id="game-message" class="message"></div>

        <!-- The actual game canvas -->
        <canvas id="game-canvas" width="800" height="600"></canvas>
    </div>

</body>
</html>
